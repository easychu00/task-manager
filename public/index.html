<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能任务管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 智能任务管理</h1>
      <p class="subtitle">高效规划，掌控每一天</p>
    </header>

    <!-- 添加任务表单 -->
    <div class="add-task-card">
      <div class="input-group">
        <input type="text" id="taskInput" placeholder="输入任务标题..." maxlength="200">
        <select id="prioritySelect">
          <option value="高">🔴 高优先级</option>
          <option value="中" selected>🟡 中优先级</option>
          <option value="低">🟢 低优先级</option>
        </select>
        <button id="addBtn" class="btn-primary">添加任务</button>
      </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <span class="filter-label">按优先级筛选：</span>
      <div class="filter-buttons">
        <button class="filter-btn active" data-priority="all">全部</button>
        <button class="filter-btn" data-priority="高">高</button>
        <button class="filter-btn" data-priority="中">中</button>
        <button class="filter-btn" data-priority="低">低</button>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="task-list" id="taskList">
      <div class="empty-state">
        <p>暂无任务，添加一个吧 ✨</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
